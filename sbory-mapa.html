 {n:"SDH Zlatníky", ok:"XIV.", starosta:"—", lat:49.9599, lng:14.4812},

 {n:"SDH Průhonice", ok:"XIV.", starosta:"—", lat:50.0018, lng:14.5606},
 {n:"SDH Dolní Břežany", ok:"XIV.", starosta:"—", lat:49.9634, lng:14.4581},
 {n:"SDH Osnice", ok:"XIV.", starosta:"—", lat:49.9693, lng:14.5514},
 {n:"SDH Vestec", ok:"XIV.", starosta:"—", lat:49.9858, lng:14.5029}
];

const map = L.map('map').setView([49.93, 14.38], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

// Tlumená paleta okrsků – podobná světlost, aby žádný nevyčníval; mimo červenou (JSDH) a modrou (MH).
const OKR = { 'I.': '#5f8f5a', 'IV.': '#c1913a', 'VI.': '#7d6fb3', 'VII.': '#3e8f8c', 'VIII.': '#b36a8e', 'IX.': '#8c7d45', 'X.': '#5a86a8', 'XII.': '#a8704f', 'XIII.': '#7f9a3c', 'XIV.': '#9a5fa8' };
const ON = { radius: 7, color: '#201e1d', weight: 1.5, fillColor: '#2f4ea0', fillOpacity: 0.95, opacity: 1 };
const onStyle = s => Object.assign({}, ON, { fillColor: OKR[s.ok] || ON.fillColor });
const OFF = { radius: 5, color: '#9a9795', weight: 1, fillColor: '#c9c6c4', fillOpacity: 0.55, opacity: 0.6 };
const allBounds = L.latLngBounds(sbory.map(s => [s.lat, s.lng]));

const markers = sbory.map(s => {
  const m = L.circleMarker([s.lat, s.lng], onStyle(s)).addTo(map);
  m.bindPopup('<b>' + s.n + '</b>' + s.ok + ' okrsek<br>Starosta okrsku: ' + s.starosta + '<br>Vedoucí MH: bude doplněno');
  m._s = s;
  return m;
});

// Driven by the parent page: { type: 'oshpz-filter', okrsek: 'IV.' | null, q: '' }
let JPO = [], MH = [], PR = [];
function popupHtml(s) {
  const f = [];
  if (JPO.includes(s.n)) f.push('<span style="background:#c2261a;color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;">JSDH</span>');
  if (MH.includes(s.n)) f.push('<span style="border:2px solid #2f4ea0;color:#2f4ea0;font-size:10.5px;font-weight:700;padding:0 5px;">MH</span>');
  if (PR.includes(s.n)) f.push('<span style="border:2px solid #b8962e;background:#f6efd8;color:#6b5418;font-size:10.5px;font-weight:700;padding:0 5px;">P</span>');
  return '<b>' + s.n + '</b>' + s.ok + ' okrsek<br>Starosta okrsku: ' + s.starosta + (f.length ? '<div style="display:flex;gap:4px;margin-top:6px;">' + f.join('') + '</div>' : '');
}
function applyFilter(okrsek, q, onlyJpo, onlyMh, onlyPr) {
  q = (q || '').trim().toLowerCase();
  const hits = [];
  markers.forEach(m => {
    const s = m._s;
    const match = (!okrsek || s.ok === okrsek) && (!q || s.n.toLowerCase().includes(q)) && (!onlyJpo || JPO.includes(s.n)) && (!onlyMh || MH.includes(s.n)) && (!onlyPr || PR.includes(s.n));
    m.setPopupContent(popupHtml(s));
    m.setStyle(match ? onStyle(s) : OFF);
    m.setRadius(match ? ON.radius : OFF.radius);
    if (match) hits.push(m);
  });
  hits.forEach(m => m.bringToFront());
  const filtered = okrsek || q || onlyJpo || onlyMh || onlyPr;
  if (hits.length && filtered) {
    map.flyToBounds(L.latLngBounds(hits.map(m => m.getLatLng())).pad(0.35), { maxZoom: 13, duration: 0.6 });
  } else if (!filtered) {
    map.flyToBounds(allBounds.pad(0.05), { duration: 0.6 });
  }
}
window.addEventListener('message', e => {
  const d = e.data;
  if (d && d.type === 'oshpz-filter') { JPO = d.jpo || []; MH = d.mh || []; PR = d.pr || []; applyFilter(d.okrsek, d.q, d.onlyJpo, d.onlyMh, d.onlyPr); }
});
map.fitBounds(allBounds.pad(0.05));
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.style.cssText = 'background:#f3f2f2;border:2px solid #201e1d;padding:8px 10px;font:12px Archivo,Arial,sans-serif;display:grid;grid-template-columns:repeat(2,auto);gap:4px 12px;';
  d.innerHTML = Object.entries(OKR).map(([k, c]) => '<span style="display:flex;align-items:center;gap:6px;"><i style="width:10px;height:10px;border-radius:50%;background:' + c + ';border:1px solid #201e1d;display:inline-block;"></i>' + k + ' okrsek</span>').join('');
  return d;
};
legend.addTo(map);
</script>
